baseURL = 'https://komarovan.github.io/prodoc-site/'
locale = 'ru-RU'
title = 'ЦП ПП ПАСПЕР'
theme = 'hugo-book'
enableRobotsTXT = false

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandaloneImageWithinParagraph = false # Отключает оборачивание картинки в тег <p>
    [markup.goldmark.parser.attribute]
      block = true  # Разрешает атрибуты для блоков
      title = true  # Разрешает атрибуты для встроенных элементов (включая картинки)